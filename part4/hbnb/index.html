<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <header>
        <img src="images/logo.png" class="logo" alt="HBnB">
        <nav>
            <a href="./hbnb/index">Home</a>
            <a href="./hbnb/login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>
    <main>
        <section id="filter">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter">
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">all</option>
            </select>
        </section>
        <section id="places-list">
            <div class="place-card" data-price="100">
                <h3>Nice Apartment</h3>
                <p>100€/night</p>
                <button class="details-button">View Details</button>
            </div>
            <div class="place-card" data-price="80">
                <h3>Cozy House</h3>
                <p>80€/night</p>
                <button class="details-button">View Details</button>
            </div>
        </section>
    </main>
    <footer>
        <p>All rights reserved</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
