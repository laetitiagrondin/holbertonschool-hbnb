<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <header>
        <img src="images/logo.png" class="logo"  alt="HBnB">
        <nav>
            <a href="./hbnb/index.html">Home</a>
            <a href="./hbnb/login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <h2>Nice apartments</h2>
            <div class="place-info">
                <p><strong>Host:</strong> John</p>
                <p><strong>Price:</strong> 100€/night</p>
                <p><strong>Description:</strong> Very nice place</p>
                <p><strong>Amenities:</strong></p>
                <ul>
                    <li>Wi-Fi</li>
                    <li>Air Conditioning</li>
                    <li>Kitchen</li>
                    <li>Parking</li>
                    <li>Pet-Friendly</li>
                </ul>
            </div>
        </section>
        <section id="reviews">
            <div class="review-card">
                <p>Great place!</p>
                <p><strong>User:</strong> Alice</p>
                <p>Rating: 5</p>
            </div>
        </section>
        <section id="add-review-button">
            <a href="add_review.html" class="button">Add a Review</a>
        </section>
        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>All rights reserved</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
