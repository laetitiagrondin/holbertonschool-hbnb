<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HBnB</title> <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" aria-label="HBnB Home">
            <img src="images/logo.png" alt="HBnB Logo" class="logo"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="logo-text" style="display:none;"><span>H</span>BnB</span>
        </a>
        <nav>
            <a href="index.html">Explore</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
    <form id="login-form">
        <h1>Login</h1> 
        
        <div class="login-icon" aria-hidden="true"></div>
        <p class="login-tagline">Welcome back — sign in to your account.</p>

        <div id="login-error" class="alert alert-error" role="alert" style="display:none;"></div>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required
               placeholder="you@example.com" autocomplete="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required
               placeholder="••••••••" autocomplete="current-password">

        <button type="submit">Login</button>
    </form>
</main>

    <footer>
        <p>&copy; <strong>HBnB</strong> 2026 &mdash; All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
