<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Places</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <a href="index.html" aria-label="HBnB Home">
            <img src="images/logo.png" alt="HBnB Logo" class="logo"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="logo-text">HBnB</span> </a>
        <nav>
            <a href="index.html">Explore</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>

    <!-- MAIN -->
    <main>

        <!-- Hero banner -->
        <div class="hero">
            <h1>Find your perfect stay</h1>
            <p>Explore unique homes hosted by real people around the world.</p>
        </div>

        <!-- Filter section -->
        <section id="filter">
            <label for="price-filter">Max Price per night:</label>
            <select id="price-filter">
                <!-- Options will be populated dynamically -->
            </select>
        </section>

        <!-- Alert messages -->
        <div id="alert-msg" class="alert alert-error" role="alert"></div>

        <!-- Places list -->
        <section id="places-list" aria-label="List of places">
            <!-- List of places will be populated dynamically -->
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; <strong>HBnB</strong> 2026 &mdash; All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
