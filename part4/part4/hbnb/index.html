<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Find your perfect stay</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <a href="index.html" aria-label="HBnB Home">
            <img src="images/logo.png" alt="HBnB Logo" class="logo" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="logo-text" style="display:none;">HBnB</span>
        </a>
        <nav>
            <a href="index.html">Explore</a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Find your perfect stay</h1>
            <p>Explore unique homes hosted by real people around the world.</p>
        </div>

        <section id="filter">
            <label for="price-filter">Max Price per night:</label>
            <select id="price-filter">
                <option value="all">All</option>
                <option value="10">10</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </section>

        <div id="alert-msg" class="alert alert-error" role="alert" style="display:none;"></div>

        <section id="places-list" aria-label="List of places">
            <div class="loading">Loading amazing places...</div>
        </section>
    </main>

    <footer>
        <p>&copy; <strong>HBnB</strong> 2026 &mdash; All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
